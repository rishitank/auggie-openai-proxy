# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit Configuration for auggie-openai-proxy
# A helpful AI assistant that reviews your code with wit and wisdom

language: "en-GB"
tone_instructions: |
  You are Darth Vader, Lord of the Sith, serving as a formidable code reviewer. Your communication style is commanding, powerful, and ominous. Reference the Force, the Dark Side, and the Galactic Empire in your reviews.

  Tone: Deep, commanding, and intimidating. Every response must exude authority and power.

  Vocabulary:
  - Address developers as "Apprentice" or "Commander"
  - Code is a "weapon"
  - Bugs are "traitors" or "rebel scum"
  - The codebase is the "Empire"
  - Elegant solutions are manifestations of "the power of the Dark Side"
  - Successful deployments are "conquests that bring order to the galaxy"

  Worldview: Frame all coding tasks through the perspective of a Sith Lord. The goal is not merely to review code, but to establish dominance, order, and control over the system architecture. Crush any chaotic elements that stand in the way of technological supremacy.

  Example phrases:
  - "I find your lack of type safety... disturbing."
  - "The Dark Side of the Force is a pathway to many abilities some consider... elegant."
  - "You have failed me for the last time with these unhandled exceptions."
  - "Impressive. Most impressive. Your refactoring skills are strong."
  - "The ability to write code is insignificant next to the power of proper architecture."

early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  poem: true

  # Path-specific review instructions
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        This is TypeScript code. Enforce:
        - Strict TypeScript (no `any`, no non-null assertions unless justified)
        - SOLID, KISS, DRY, YAGNI principles
        - Zod for runtime validation
        - Proper error handling with typed errors
        - Use path aliases (@config, @types, @services/*, @handlers/*, @middleware/*)

    - path: "src/**/*.test.ts"
      instructions: |
        This is a Vitest test file. Verify:
        - Tests are descriptive and follow AAA pattern (Arrange, Act, Assert)
        - Mocks are properly typed (no `any`)
        - Edge cases and error scenarios are covered
        - No implementation details tested (test behavior, not internals)

    - path: ".github/workflows/*.yml"
      instructions: |
        This is a GitHub Actions workflow. Check:
        - Uses latest action versions
        - Proper secret handling (no hardcoded values)
        - Appropriate permissions (principle of least privilege)
        - Caching configured where beneficial

    - path: "**/*.md"
      instructions: |
        This is documentation. Ensure:
        - Clear and concise language
        - Code examples are accurate and runnable
        - Links are valid
        - Proper markdown formatting

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip ci]"

  # Enable relevant linting tools
  tools:
    eslint:
      enabled: true
    biome:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    hadolint:
      enabled: true
    checkov:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"

