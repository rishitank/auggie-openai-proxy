name: zz-tmp-merge-main

# TEMPORARY. Merges main into this PR branch because the merge conflicts and
# cannot be done with the "Update branch" API. It resolves ONLY the expected
# conflict (package-lock.json) by keeping this branch's side, fails on anything else,
# verifies the result, and pushes the merge commit. Deleted right after it runs.

on:
  push:
    branches: [fix/security-dependabot-alerts]

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/security-dependabot-alerts
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Merge origin/main
        env:
          EXPECTED: package-lock.json
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          echo "branch head: $(git rev-parse HEAD)  main: $(git rev-parse origin/main)"
          if git merge --no-ff --no-edit origin/main; then
            echo "::error::expected a conflict in $EXPECTED but the merge was clean; use the Update branch API instead"
            exit 1
          fi
          conflicted="$(git diff --name-only --diff-filter=U)"
          echo "conflicted files: $conflicted"
          if [ "$conflicted" != "$EXPECTED" ]; then
            echo "::error::unexpected conflict set: $conflicted"
            exit 1
          fi
          git checkout --ours -- "$EXPECTED"
          git add -- "$EXPECTED"
          git commit -m "Merge branch 'main' into fix/security-dependabot-alerts" -m "package-lock.json conflicted with main's #82 (vitest 4.1.11, lockfile only). This branch's lockfile is kept: it already resolves vitest and @vitest/coverage-v8 to 4.1.11 and also carries the auggie-sdk 0.1.18 and override changes. package.json is unchanged by main, and npm ci confirms the kept lockfile matches it."

      - name: Verify the merge
        env:
          EXPECTED: package-lock.json
        run: |
          set -euo pipefail
          # Two parents: this branch and main.
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git merge-base --is-ancestor origin/main HEAD
          # The resolved file is byte-identical to this branch's version.
          git diff --exit-code HEAD^1 HEAD -- "$EXPECTED"
          # No conflict markers anywhere in tracked text files.
          if git grep -n -I -E '^(<<<<<<<|>>>>>>>) ' -- .; then
            echo '::error::conflict markers found'
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json');const v=n=>l.packages['node_modules/'+n].version;console.log('vitest',v('vitest'),'@vitest/coverage-v8',v('@vitest/coverage-v8'),'@augmentcode/auggie-sdk',v('@augmentcode/auggie-sdk'));if(v('vitest')!=='4.1.11')process.exit(1)"
          echo 'Files changed by the merge relative to this branch:'
          git diff --stat HEAD^1 HEAD

      - name: Push
        run: git push origin HEAD:fix/security-dependabot-alerts
