name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    # Don't run on draft PRs or forked PRs.
    # Renovate PRs are skipped: Renovate arms GitHub auto-merge itself, but only
    # where the shared preset (github>rishitank/.github:node) allows it. Majors,
    # Node/npm bumps and production minors are meant to wait for a human, and
    # arming auto-merge here would bypass that policy.
    # PRs opened by a human account (including agent PRs) are skipped too: the
    # owner merges those. The review-gate ruleset counts a CodeRabbit approval as
    # the required review, so arming them here would merge them the moment
    # CodeRabbit approved. Only other bot PRs (Dependabot, release) are armed, and
    # those still need the owner's approval because CodeRabbit skips bot PRs.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    steps:
      - name: Enable auto-merge (squash)
        # Using PAT instead of GITHUB_TOKEN so that the merge triggers the 'closed' event
        # for other workflows (GITHUB_TOKEN actions don't trigger subsequent workflows).
        # Runs triggered by Dependabot cannot read repository secrets (PAT_AUTO_MERGE is
        # empty there), so they fall back to GITHUB_TOKEN, which the permissions above
        # grant contents:write + pull-requests:write for `gh pr merge --auto`.
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.PAT_AUTO_MERGE }}
