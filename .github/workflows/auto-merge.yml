name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    # Don't run on draft PRs, forked PRs, or closed PRs
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge (squash)
        # Using PAT instead of GITHUB_TOKEN so that the merge triggers the 'closed' event
        # for other workflows (GITHUB_TOKEN actions don't trigger subsequent workflows)
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.PAT_AUTO_MERGE }}

  delete-branch:
    name: Delete Merged Branch
    runs-on: ubuntu-latest
    # Only run when PR is merged (not just closed) and not from a fork
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete head branch
        run: |
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH_NAME}" || echo "Branch already deleted or protected"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
